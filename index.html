    <!-- <title>을 의도적으로 비워둠 — 모든 라우트가 src/components/Seo.jsx에서 <title>을 렌더링해 채운다.
         React 19는 컴포넌트가 렌더링한 head 태그끼리는 자동으로 정리해주지만, 여기 정적으로 하나라도
         박아두면 React 트리 밖의 태그라 제거되지 않고 Seo가 렌더링한 것과 중복으로 남는다(실측 확인됨) —
         빈 상태가 아니라 "Gurume Tabi" 같은 값을 넣고 싶어져도 넣지 말 것. -->
  </head>
